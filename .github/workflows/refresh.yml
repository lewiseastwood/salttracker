# Unattended scrape: daily in June–August, Mondays otherwise.
# GitHub does not fire a new scheduled workflow until it has run once — use
# "Run workflow" (workflow_dispatch) after the first push. Cron is 11:15 UTC
# (07:15 Eastern during EDT). Off-season weekdays start the job then skip the
# crawl so the schedule stays armed.
#
# Optional repository secrets (scrape works without them):
#   SALTTRACKER_CONTACT       mailbox; otherwise the public repo URL is used
#   SALTTRACKER_WEBHOOK_URL   Slack/Teams/generic POST for new-season alerts
#   SALTTRACKER_ALERT_EMAIL   optional, requires the SMTP_* secrets below
#   SALTTRACKER_SMTP_HOST / SALTTRACKER_SMTP_USER / SALTTRACKER_SMTP_PASS
name: Refresh salt contracts

on:
  schedule:
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Cache downloaded contract files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: salt-raw-${{ runner.os }}-v1

      - name: Decide how far to crawl
        id: window
        run: |
          month=$(date -u +%m)
          dow=$(date -u +%u)
          if [ "$month" = "06" ] || [ "$month" = "07" ] || [ "$month" = "08" ]; then
            echo "peak=1" >> "$GITHUB_OUTPUT"
            echo "scan=1" >> "$GITHUB_OUTPUT"
          elif [ "$dow" = "1" ]; then
            echo "peak=0" >> "$GITHUB_OUTPUT"
            echo "scan=1" >> "$GITHUB_OUTPUT"
          else
            echo "peak=0" >> "$GITHUB_OUTPUT"
            echo "scan=0" >> "$GITHUB_OUTPUT"
            echo "Off-season weekday — skip the crawl. Monday or Run workflow still scrapes."
          fi

      - name: Refresh
        id: refresh
        if: steps.window.outputs.scan == '1' || github.event_name == 'workflow_dispatch'
        env:
          SALTTRACKER_CONTACT: ${{ secrets.SALTTRACKER_CONTACT }}
          SALTTRACKER_WEBHOOK_URL: ${{ secrets.SALTTRACKER_WEBHOOK_URL }}
          SALTTRACKER_ALERT_EMAIL: ${{ secrets.SALTTRACKER_ALERT_EMAIL }}
          SALTTRACKER_SMTP_HOST: ${{ secrets.SALTTRACKER_SMTP_HOST }}
          SALTTRACKER_SMTP_USER: ${{ secrets.SALTTRACKER_SMTP_USER }}
          SALTTRACKER_SMTP_PASS: ${{ secrets.SALTTRACKER_SMTP_PASS }}
          SALTTRACKER_RPS: "2"
        run: |
          extra=()
          if [ "${{ steps.window.outputs.peak }}" != "1" ]; then
            extra+=(--no-archive)
          fi
          python scripts/refresh.py "${extra[@]}"
          python scripts/build_exec_dashboard.py

      - name: Persist outputs
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        run: |
          git config user.name "salttracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output data/watch_state.json data/alerts.jsonl data/manifest.json data/refresh_log.jsonl data/interim/pa_sid_scan.json || true
          if git diff --cached --quiet; then
            echo "No dataset change"
          else
            git commit -m "Refresh contract dataset $(date -u +%Y-%m-%d)"
            git pull --rebase origin HEAD
            git push
          fi
