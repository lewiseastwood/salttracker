# Unattended scrape. GitHub cron is UTC. 07:15 Eastern in June–August is EDT
# (UTC-4), so 07:15 ET = 11:15 UTC. Cadence is two cron month fields, not a
# date guard that starts the job and skips the crawl.
#
# GitHub does not fire a new scheduled workflow until it has run once — use
# "Run workflow" (workflow_dispatch) after the first push.
#
# Optional repository secrets (scrape works without them):
#   SALTTRACKER_CONTACT       mailbox; otherwise the public repo URL is used
#   SALTTRACKER_WEBHOOK_URL  Slack/Teams/generic POST for new-season alerts
#   SALTTRACKER_ALERT_EMAIL   optional, requires the SMTP_* secrets below
#   SALTTRACKER_SMTP_HOST / SALTTRACKER_SMTP_USER / SALTTRACKER_SMTP_PASS
name: Refresh salt contracts

on:
  schedule:
    - cron: "15 11 * 6,7,8 *"
    - cron: "15 11 * 1,2,3,4,5,9,10,11,12 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Cache downloaded contract files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: salt-raw-${{ runner.os }}-v1

      - name: Refresh
        id: refresh
        env:
          SALTTRACKER_CONTACT: ${{ secrets.SALTTRACKER_CONTACT }}
          SALTTRACKER_WEBHOOK_URL: ${{ secrets.SALTTRACKER_WEBHOOK_URL }}
          SALTTRACKER_ALERT_EMAIL: ${{ secrets.SALTTRACKER_ALERT_EMAIL }}
          SALTTRACKER_SMTP_HOST: ${{ secrets.SALTTRACKER_SMTP_HOST }}
          SALTTRACKER_SMTP_USER: ${{ secrets.SALTTRACKER_SMTP_USER }}
          SALTTRACKER_SMTP_PASS: ${{ secrets.SALTTRACKER_SMTP_PASS }}
          SALTTRACKER_RPS: "2"
        run: |
          extra=()
          month=$(date -u +%m)
          # Wayback is extra history, not cadence. Skip it off-season.
          if [ "$month" != "06" ] && [ "$month" != "07" ] && [ "$month" != "08" ]; then
            extra+=(--no-archive)
          fi
          python scripts/refresh.py "${extra[@]}"

      - name: Build dashboard pack
        # Rebuild even on a failed scrape so the HTML strip matches watch_state.
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        continue-on-error: true
        run: python scripts/build_exec_dashboard.py

      # Commit on success and on failure. last_run always changes, so this is
      # the 60-day keepalive. A red Monday with no push disables cron in 60 days.
      - name: Persist outputs
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        run: |
          git config user.name "salttracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/persist_refresh.sh
