# Weekly detect-and-propose. Does not push to main.
#
# Routine PRs auto-merge so Streamlit and the HTML pack on main update.
# Needs-review PRs wait. There is no git push to origin/main.
#
# GitHub does not fire a new scheduled workflow until it has run once — use
# "Run workflow" (workflow_dispatch) after the first push.
name: Weekly salt refresh

on:
  schedule:
    - cron: "15 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Cache downloaded contract files
        uses: actions/cache@v4
        with:
          path: |
            data/raw
          key: salt-raw-${{ runner.os }}-v2

      - name: Propose
        env:
          SALTTRACKER_CONTACT: ${{ secrets.SALTTRACKER_CONTACT }}
          SALTTRACKER_CLASSIFY_API_KEY: ${{ secrets.SALTTRACKER_CLASSIFY_API_KEY }}
          SALTTRACKER_CLASSIFY_API_URL: ${{ secrets.SALTTRACKER_CLASSIFY_API_URL }}
          SALTTRACKER_CLASSIFY_MODEL: ${{ secrets.SALTTRACKER_CLASSIFY_MODEL }}
          SALTTRACKER_RPS: "2"
        run: python scripts/propose.py

      - name: Branch, commit, push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "salttracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stamp=$(python3 -c "import json; print(json.load(open('data/staging/proposal.json'))['stamp'].replace(':','-'))")
          branch="refresh/${stamp}"
          git checkout -B "$branch"
          bash scripts/persist_refresh.sh
          git push -u origin HEAD

      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/open_refresh_pr.sh
